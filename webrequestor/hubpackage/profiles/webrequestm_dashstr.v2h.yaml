    title: Dashboard State
    description: Choose the dashboard display state
    required: false
    explicit: false
    preferenceType: enumeration
    definition:
      options:
        none: None
        extractstring: Extracted string value
        extractnum: Extracted numeric value
        extracttemp: Temperature (°C, with graph)
        extractdkh: dKH value (3 decimals, with graph)
      default: extractstring
