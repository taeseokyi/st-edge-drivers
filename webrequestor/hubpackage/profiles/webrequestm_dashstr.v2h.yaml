preferences:
  - title: "Select web requeset to refresh"
    name: refreshurl
    description: "Number of Web request"
    required: true
    preferenceType: number
    definition:
      minimum: 1
      maximum: 50
      default: 1
  - title: "Periodic Refresh"
    name: autorefresh
    description: "Enable/disable"
    required: true
    preferenceType: enumeration
    definition:
      options:
        enabled: "Enable auto refresh"
        disabled: "No auto refresh"
      default: disabled
  - title: "Refresh Rate"
    name: refreshrate
    description: "Every n minutes"
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 1440
      default: 60
  - preferenceId: timeout
    name: timeout
    title: Response Timeout
    description: Number of seconds
    required: true
    explicit: false
    preferenceType: number
    definition:
      minimum: 1
      maximum: 60
      default: 3
  - preferenceId: valuekey
    name: valuekey
    title: Response key to extract
    description: JSON or XML key
    required: false
    explicit: false
    preferenceType: string
    definition:
      minLength: 2
      stringType: text
      default: x1x
  - preferenceId: autoheaders
